[project]
name = "jime-narrador"
version = "0.1.0"
description = "Offline automatic narrator for the Journeys in Middle-earth companion app"
requires-python = ">=3.12,<3.14"   # 3.14 has no PyTorch wheels
license = { text = "MIT" }

dependencies = [
    "UnityPy",              # phase 1: extract the corpus from the AssetBundles
    "rapidfuzz>=3.0",       # phase 3: fuzzy matching
    "num2words",            # numbers spelled out (otherwise the TTS reads them in Spanish)
    "pillow",               # image cropping before OCR
]

[project.optional-dependencies]
# Speech synthesis. Light: a 60 MB voice, on the CPU. The engine this replaced
# pulled in torch and ~3 GB of weights and wanted a GPU to be viable at all.
tts = ["piper-tts>=1.6"]
# Native macOS OCR (Apple Vision). Offline, ~150 ms.
ocr = ["ocrmac"]
# Portable OCR, for platforms without Apple Vision. ~19 MB of ONNX weights.
ocr-portable = ["rapidocr-onnxruntime"]
# Window capture. ScreenCaptureKit is the only API on macOS 26 that still sees
# windows; Windows.Graphics.Capture is the equivalent on Windows, where BitBlt
# returns black frames for Unity.
capture-macos = ["pyobjc-framework-ScreenCaptureKit", "pyobjc-framework-Quartz"]
capture-windows = ["windows-capture"]

[tool.setuptools]
py-modules = ["glyphs", "matcher", "check_pace", "demo", "batch",
              "watch_log", "trigger", "player", "narrator"]
packages = ["capture", "ocr"]
